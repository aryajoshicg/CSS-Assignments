
<!DOCTYPE html>
<html>
<head>
    <title>SuperOver</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #101c2c;
            font-family: Verdana, sans-serif;
            min-width: 1250px;
            width: 1250px;
        }
        .main {
            width: 1200px;
            height: 650px;
            margin: 10px auto;
            background: linear-gradient(to bottom, #102b4c, #263c42, #18351f);
            position: relative;
            overflow: hidden;
        }
        .logo {
            text-align: center;
            color: white;
            font-size: 25px;
            font-weight: bold;
            padding-top: 25px;
            letter-spacing: 2px;
        }
        .logo span {
            color: #f4c95d;
        }
        .score-container {
            display: flex;
            justify-content: center;
            gap: 75px;
            margin-top: 65px;
        }
        .score-box {
            width: 355px;
            height: 275px;
            border-radius: 20px;
            text-align: center;
            color: white;
            padding-top: 20px;
            box-sizing: border-box;
        }

        .india {
            background-color: #2467b5;
        }

        .pakistan {
            background-color: #249b78;
        }

        .team {
            font-size: 65px;
            font-weight: bold;
            margin-top: 20px;
        }
        .runs {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 35px;
        }
        .ball {
            width: 40px;
            height: 40px;
            background-color: white;
            color: #111111;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
        }
        .ball:nth-child(2) {
            width: 37px;
            height: 37px;
            margin-top: 5px;
        }
        .ball:nth-child(3) {
            width: 43px;
            height: 43px;
            margin-top: -5px;
        }
        .ball:nth-child(4) {
            width: 38px;
            height: 38px;
            margin-top: 3px;
        }
        .ball:nth-child(5) {
            width: 42px;
            height: 42px;
            margin-top: -4px;
        }
        .ball:nth-child(6) {
            width: 36px;
            height: 36px;
            margin-top: 6px;
        }
        .total {
            font-size: 38px;
            font-weight: bold;
            margin-top: 28px;
        }
        .icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 55px;
            margin-top: 65px;
        }
        .icon {
            width: 75px;
            height: 75px;
            border-radius: 22px;
            background-color: #f3b83e;
            color: white;
            border: 4px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            box-shadow: 0px 4px 5px #111111;
        }
        .reset {
            background-color: #e34d52;
            width: 82px;
            height: 82px;
            font-size: 50px;
            transform: rotate(-5deg);
        }
        .edit {
            transform: rotate(8deg);
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="logo">
            🏏 SUPER
            <br>
            <span>OVER</span>
        </div>
        <div class="score-container">
            <div class="score-box india">
                <div class="team">IND</div>
                <div class="runs">
                    <div class="ball">4</div>
                    <div class="ball">3</div>
                    <div class="ball">2</div>
                    <div class="ball">6</div>
                    <div class="ball">6</div>
                    <div class="ball">6</div>
                </div>

                <div class="total">
                    27/0
                </div>

            </div>

            <div class="score-box pakistan">

                <div class="team">PAK</div>

                <div class="runs">
                    <div class="ball">2</div>
                    <div class="ball">4</div>
                    <div class="ball">0</div>
                    <div class="ball">3</div>
                    <div class="ball">1</div>
                    <div class="ball">4</div>
                </div>
                <div class="total">
                    14/0
                </div>
            </div>
        </div>

        <div class="icons">

            <div class="icon edit">
                ✎
            </div>
            <div class="icon reset">
                ↶
            </div>
        </div>
    </div>
</body>
</html>
