
<!DOCTYPE html>
<html>
<head>
    <title>Document</title>

    <style>
        body {
            background-color: #f5f2ed;
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            min-width: 700px;
        }

        .board {
            width: 600px;
            height: 600px;
            margin: auto;
            display: grid;
            grid-template-columns: 240px 120px 240px;
            grid-template-rows: 240px 120px 240px;
            border: 2px solid black;
        }
        .home {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .red {
            background-color: #f04450;
        }
        .green {
            background-color: #159b72;
        }
        .blue {
            background-color: #6264d8;
        }
        .yellow {
            background-color: #e8d34c;
        }

        .inner {
            width: 160px;
            height: 160px;
            background-color: white;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            padding: 15px;
        }
        .circle {
            width: 45px;
            height: 45px;
            border: 6px solid;
            border-radius: 50%;
            margin: auto;
        }
        .red-circle {
            border-color: #f04450;
        }
        .green-circle {
            border-color: #159b72;
        }
        .blue-circle {
            border-color: #6264d8;
        }
        .yellow-circle {
            border-color: #e8d34c;
        }
        .vertical {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .cell {
            background-color: white;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
        }
        .green-cell {
            background-color: #159b72;
        }
        .blue-cell {
            background-color: #6264d8;
        }
        .red-cell {
            background-color: #f04450;
        }
        .yellow-cell {
            background-color: #e8d34c;
        }
        .horizontal {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }
        .middle {
            position: relative;
            width: 120px;
            height: 120px;
        }
        .triangle {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .top {
            background-color: #159b72;
            clip-path: polygon(0 0, 100% 0, 50% 50%);
        }
        .right {
            background-color: #e8d34c;
            clip-path: polygon(100% 0, 100% 100%, 50% 50%);
        }
        .bottom {
            background-color: #6264d8;
            clip-path: polygon(0 100%, 100% 100%, 50% 50%);
        }
        .left {
            background-color: #f04450;
            clip-path: polygon(0 0, 0 100%, 50% 50%);
        }
    </style>
</head>

<body>

    <div class="board">
        <div class="home red">
            <div class="inner">
                <div class="circle red-circle"></div>
                <div class="circle red-circle"></div>
                <div class="circle red-circle"></div>
            </div>
        </div>
        <div class="vertical">

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green-cell"></div>
            <div class="cell green-cell">★</div>

            <div class="cell green-cell">★</div>
            <div class="cell green-cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green-cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green-cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green-cell"></div>
            <div class="cell"></div>
        </div>
        <div class="home green">
            <div class="inner">
                <div class="circle green-circle"></div>
                <div class="circle green-circle"></div>
                <div class="circle green-circle"></div>
            </div>
        </div>
        <div class="horizontal">
            <div class="cell"></div>
            <div class="cell red-cell">★</div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell red-cell"></div>
            <div class="cell red-cell"></div>
            <div class="cell red-cell"></div>
            <div class="cell red-cell"></div>
            <div class="cell red-cell"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell red-cell">★</div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="middle">

            <div class="triangle top"></div>
            <div class="triangle right"></div>
            <div class="triangle bottom"></div>
            <div class="triangle left"></div>
        </div>
        <div class="horizontal">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell yellow-cell">★</div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell yellow-cell"></div>
            <div class="cell yellow-cell"></div>
            <div class="cell yellow-cell"></div>
            <div class="cell yellow-cell"></div>
            <div class="cell yellow-cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell yellow-cell">★</div>
            <div class="cell"></div>
        </div>
        <div class="home blue">
            <div class="inner">
                <div class="circle blue-circle"></div>
                <div class="circle blue-circle"></div>
                <div class="circle blue-circle"></div>
            </div>
        </div>
        <div class="vertical">
            <div class="cell"></div>
            <div class="cell blue-cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell blue-cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell blue-cell"></div>
            <div class="cell blue-cell">★</div>
            <div class="cell blue-cell">★</div>
            <div class="cell blue-cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell blue-cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="home yellow">
            <div class="inner">
                <div class="circle yellow-circle"></div>
                <div class="circle yellow-circle"></div>
                <div class="circle yellow-circle"></div>
            </div>
        </div>
    </div>
</body>
</html>
