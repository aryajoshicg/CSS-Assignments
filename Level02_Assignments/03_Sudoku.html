
<!DOCTYPE html>
<html>
<head>
    <title>Sudoku</title>

    <style>
        body {
            background-color: #f8f5ef;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            min-width: 850px;
        }
        .main {
            width: 780px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            gap: 30px;
        }
        .section {
            text-align: center;
        }

        h2 {
            font-size: 22px;
            font-weight: normal;
            letter-spacing: 3px;
            color: #333333;
            margin-bottom: 18px;
        }

        table {
            border-collapse: collapse;
            width: 350px;
            height: 350px;
            table-layout: fixed;
            background-color: white;
            border: 2px solid #333333;
        }
        td {
            border: 1px solid #777777;
            text-align: center;
            font-size: 23px;
            color: #333333;
            width: 38px;
            height: 38px;
        }
        td:nth-child(3n) {
            border-right: 3px solid #333333;
        }
        tr:nth-child(3n) td {
            border-bottom: 3px solid #333333;
        }
        table tr:nth-child(-n+3) td:nth-child(n+4):nth-child(-n+6),
        table tr:nth-child(n+4):nth-child(-n+6) td:nth-child(-n+3),
        table tr:nth-child(n+4):nth-child(-n+6) td:nth-child(n+7):nth-child(-n+9),
        table tr:nth-child(n+7) td:nth-child(n+4):nth-child(-n+6) {
            background-color: #b9d9e8;
        }

    </style>
</head>

<body>

    <div class="main">
        <div class="section">
            <h2>SUDOKU</h2>
            <table>
                <tr>
                    <td>8</td><td></td><td>6</td>
                    <td></td><td></td><td>3</td>
                    <td></td><td>9</td><td></td>
                </tr>
                <tr>
                    <td></td><td>4</td><td></td>
                    <td></td><td>1</td><td></td>
                    <td></td><td>6</td><td>8</td>
                </tr>
                <tr>
                    <td>2</td><td></td><td></td>
                    <td>8</td><td>7</td><td></td>
                    <td></td><td></td><td>5</td>
                </tr>
                <tr>
                    <td>1</td><td></td><td>8</td>
                    <td></td><td></td><td>5</td>
                    <td></td><td>2</td><td></td>
                </tr>
                <tr>
                    <td></td><td>3</td><td></td>
                    <td>1</td><td></td><td></td>
                    <td></td><td>5</td><td></td>
                </tr>
                <tr>
                    <td>7</td><td></td><td>5</td>
                    <td></td><td>3</td><td></td>
                    <td>9</td><td></td><td></td>
                </tr>
                <tr>
                    <td></td><td>2</td><td>1</td>
                    <td></td><td></td><td>7</td>
                    <td></td><td>4</td><td></td>
                </tr>
                <tr>
                    <td>6</td><td></td><td></td>
                    <td></td><td>2</td><td></td>
                    <td>8</td><td></td><td></td>
                </tr>
                <tr>
                    <td></td><td>8</td><td>7</td>
                    <td>6</td><td></td><td>4</td>
                    <td></td><td></td><td>3</td>
                </tr>
            </table>
        </div>

        <div class="section">
            <h2>ANSWER</h2>
            <table>
                <tr>
                    <td>8</td><td>7</td><td>6</td>
                    <td>5</td><td>4</td><td>3</td>
                    <td>1</td><td>9</td><td>2</td>
                </tr>
                <tr>
                    <td>5</td><td>4</td><td>3</td>
                    <td>2</td><td>1</td><td>9</td>
                    <td>7</td><td>6</td><td>8</td>
                </tr>
                <tr>
                    <td>2</td><td>1</td><td>9</td>
                    <td>8</td><td>7</td><td>6</td>
                    <td>4</td><td>3</td><td>5</td>
                </tr>
                <tr>
                    <td>1</td><td>9</td><td>8</td>
                    <td>7</td><td>6</td><td>5</td>
                    <td>3</td><td>2</td><td>4</td>
                </tr>
                <tr>
                    <td>4</td><td>3</td><td>2</td>
                    <td>1</td><td>9</td><td>8</td>
                    <td>6</td><td>5</td><td>7</td>
                </tr>
                <tr>
                    <td>7</td><td>6</td><td>5</td>
                    <td>4</td><td>3</td><td>2</td>
                    <td>9</td><td>8</td><td>1</td>
                </tr>
                <tr>
                    <td>3</td><td>2</td><td>1</td>
                    <td>9</td><td>8</td><td>7</td>
                    <td>5</td><td>4</td><td>6</td>
                </tr>
                <tr>
                    <td>6</td><td>5</td><td>4</td>
                    <td>3</td><td>2</td><td>1</td>
                    <td>8</td><td>7</td><td>9</td>
                </tr>
                <tr>
                    <td>9</td><td>8</td><td>7</td>
                    <td>6</td><td>5</td><td>4</td>
                    <td>2</td><td>1</td><td>3</td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
